# ---------------------------------------------------------
# Rental Management System — Docker Compose
# Services: db (PostgreSQL), backend (Django + Gunicorn),
#           frontend (Nginx serving React on port 8021)
# ---------------------------------------------------------
services:
  db:
    image: postgres:15-alpine
    container_name: rental_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: rental_backend
    command: gunicorn rental_system_main.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - 8000

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: rental_frontend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8021:8021"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
{% extends 'base.html' %}

{% block content %}

<h3 class="text-center mt-5">Add New Payment</h3>
<form action="{% url 'add_payment' %}" method="POST">
    {% csrf_token %}
    {{ payment_form.as_p }}
    <button type="submit" class="btn btn-primary">Submit</button>
    <a href="{% url 'add_property_cancel' %}" class="btn btn-danger">
        Cancel
    </a>
</form>

{% endblock %}
